[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems84"
version = "0.1.0"
description = "GEMSDOE84 — Lane H84-THMS: Thermo-Hydro-Mechanical Silica-Seal Fault-Valve, Dual-Scale 1m/10m Fluvial-Scarp Discontinuity & Counterfactual Dual-Head 300m Kernel Dinkelbach Allocator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "lightgbm>=4.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", "vendor"]
testpaths = ["tests"]
