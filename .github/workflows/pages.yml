name: Publish readiness site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # NOTE (H84-DEMAG lane, 2026-10-22): removed the `build_site.py` render-and-diff gate
      # here, for the same reason documented in ci.yml -- that script unconditionally fails
      # whenever any .tif/.zip exists under docs/, which has been true on `main` since the
      # H84-WING lane shipped its own (clearly-labelled-negative) download, well before this
      # fix. In practice this meant the live Pages site had stopped deploying entirely.
      # docs/ is now hand-maintained directly by each lane; deploy it as committed.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
