name: Tests and release-state checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Current run cards and site must reproduce exactly
        run: |
          python scripts/build_run_card.py
          python scripts/build_site.py
          git diff --exit-code -- docs index.html executive-summary.html run_card.json evidence/run-card.json evidence/run_card.json registry/run_card.json
