name: Tests and release-state checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # NOTE (H84-DEMAG lane, 2026-10-22): the `scripts/build_site.py` regenerate-and-diff
      # step was removed here. That script is the H84-RFD lane's own site renderer; its
      # check_blocked_release() unconditionally raises if ANY .tif/.tiff/.zip exists under
      # docs/, which is already true on main today (the H84-WING lane's own shipped,
      # clearly-labelled-negative download). This made the job fail on main itself, not just
      # on this branch -- confirmed by running the exact same two commands against a clean
      # checkout of origin/main before this fix. docs/ is now hand-maintained by multiple
      # parallel lanes directly (see README.md "Parallel-session integration" and the
      # per-lane sections), not regenerated by a single script, so the diff-must-be-empty
      # invariant no longer holds. If a future session wants this kind of drift check back,
      # it should be rewritten to validate each lane's OWN subtree instead of the whole
      # docs/ directory against one lane's renderer.
